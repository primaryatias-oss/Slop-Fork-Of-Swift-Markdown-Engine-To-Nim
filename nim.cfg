# Shared compiler options for the markdown engine, the SDL3 UI layer and the
# tests. Keeping them here means `nim c tests/foo.nim` works from a clean
# checkout with no flags.

--path:"$projectDir/src"
--path:"$projectDir/vendor"
--path:"src"
--path:"vendor"

# The engine is pure computation over UTF-16 buffers; ORC keeps the parser's
# temporary seqs cheap without a stop-the-world collector during typing.
--mm:orc
--define:useMalloc:off

# The UI layer calls into SDL3 from one thread only.
--threads:off

--styleCheck:off
--warning[ProveField]:off
